name: Worker CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Worker and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf
        env:
          POSTGRES_DB: entenda_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres -d entenda_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install -r apps/worker/requirements.txt
          python -m pip check
          python -m venv "$RUNNER_TEMP/quality-tools"
          "$RUNNER_TEMP/quality-tools/bin/python" -m pip install ruff==0.11.13 pip-audit==2.9.0

      - name: Check formatting and static integrity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
          "$RUNNER_TEMP/quality-tools/bin/ruff" check --extend-select W apps/worker

      - name: Audit worker dependencies
        run: |
          "$RUNNER_TEMP/quality-tools/bin/pip-audit" -r apps/worker/requirements.txt \
            --cache-dir "$RUNNER_TEMP/pip-audit" --timeout 15

      - name: Apply migrations and run SQL checks
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          for file in supabase/migrations/*.sql supabase/tests/*.sql; do
            echo "Running $file"
            docker exec -i "$POSTGRES_CONTAINER" psql -X -U postgres -d entenda_ci \
              -v ON_ERROR_STOP=1 < "$file"
          done

      - name: Run worker integration tests
        env:
          ENTENDA_TEST_DATABASE_URL: postgresql://postgres@localhost:${{ job.services.postgres.ports['5432'] }}/entenda_ci
        run: python -m unittest discover -s apps/worker -v
